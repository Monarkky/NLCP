<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Rkpzz Bot</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e2e; color: white; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; margin: 0; }
        .container { width: 100%; max-width: 900px; background: #2a2a35; padding: 30px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; }
        
        /* LOGIN SCREEN CSS */
        #login-screen { text-align: center; width: 100%; max-width: 350px; background: #2a2a35; padding: 40px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #login-screen h2 { margin-top: 0; color: #3498db; }
        .login-input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 5px; border: none; background: #1e1e2e; color: white; box-sizing: border-box; font-size: 14px; }
        .btn-login { width: 100%; padding: 12px; border: none; border-radius: 5px; background: #3498db; color: white; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-login:hover { background: #2980b9; }

        /* DASHBOARD CSS */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #444; }
        th { background-color: #3a3a4a; }
        .btn { padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; font-size: 12px; }
        .btn-ban { background-color: #e74c3c; }
        .btn-active { background-color: #27ae60; }
        .status-aktif { color: #2ecc71; font-weight: bold; }
        .status-banned { color: #e74c3c; font-weight: bold; }
        .device-id { font-family: monospace; color: #f1c40f; }
    </style>
</head>
<body>

<!-- TAMPILAN LOGIN ADMIN -->
<div id="login-screen">
    <h2>🔒 Admin Login</h2>
    <input type="text" id="adminId" class="login-input" placeholder="Admin ID">
    <input type="password" id="adminPass" class="login-input" placeholder="Password">
    <button class="btn-login" onclick="cekLogin()">MASUK</button>
</div>

<!-- TAMPILAN DASHBOARD -->
<div id="dashboard" class="container">
    <h2>🛠️ Admin Dashboard - Rkpzz Bot</h2>
    <p style="color: #bdc3c7; margin-bottom: 5px;">Semua bot yang dijalankan klien akan otomatis terdeteksi dan masuk ke daftar di bawah ini.</p>

    <table>
        <thead>
            <tr>
                <th>Nama PC / User Terakhir</th>
                <th>Device ID (Unik PC)</th>
                <th>Status Lisensi</th>
                <th>Aksi (Kill Switch)</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <!-- Data dari Firebase akan dimunculkan di sini secara otomatis -->
        </tbody>
    </table>
</div>

<!-- Import Firebase SDK (Versi 8 Compat) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
    // ==========================================
    // PENGATURAN ID & PASSWORD ADMIN ANDA
    // ==========================================
    const ADMIN_USER = "monarkky";  // Silakan ganti sesuai keinginan
    const ADMIN_PASS = "Lucifer12@";  // Silakan ganti sesuai keinginan

    function cekLogin() {
        const user = document.getElementById("adminId").value;
        const pass = document.getElementById("adminPass").value;
        
        if (user === ADMIN_USER && pass === ADMIN_PASS) {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("dashboard").style.display = "block";
            loadDataFirebase(); // Mulai tarik data real-time dari Firebase
        } else {
            alert("❌ ID atau Password Admin Salah!");
        }
    }

    // ==========================================
    // KONFIGURASI FIREBASE ANDA
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyBj9ICL_C1c9_2_pxPpuo5Y1I2pQHcEHbY",
        authDomain: "rkpzz-bot-db.firebaseapp.com",
        projectId: "rkpzz-bot-db",
        storageBucket: "rkpzz-bot-db.firebasestorage.app",
        messagingSenderId: "1077559204927",
        appId: "1:1077559204927:web:4323207890faeaab1cec8a",
        measurementId: "G-1D7LE6NJWX"
    };

    // Inisialisasi Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ==========================================
    // FUNGSI TARIK DATA REAL-TIME (Koleksi: simple_devices)
    // ==========================================
    function loadDataFirebase() {
        db.collection("simple_devices").onSnapshot((querySnapshot) => {
            const tableBody = document.getElementById("table-body");
            tableBody.innerHTML = ""; // Bersihkan tabel setiap ada update
            
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const deviceId = doc.id; // Menggunakan Device ID unik komputer klien
                
                let statusText = data.status === "aktif" ? "<span class='status-aktif'>Aktif</span>" : "<span class='status-banned'>BANNED</span>";
                
                let btnAction = data.status === "aktif" 
                    ? `<button class="btn btn-ban" onclick="ubahStatus('${deviceId}', 'banned')">MATIKAN BOT</button>`
                    : `<button class="btn btn-active" onclick="ubahStatus('${deviceId}', 'aktif')">AKTIFKAN KEMBALI</button>`;

                tableBody.innerHTML += `
                    <tr>
                        <td><strong>${data.pcName || 'Unknown PC'}</strong><br><small style="color:#7f8c8d;">User: ${data.lastUser || '-'}</small></td>
                        <td class="device-id">${deviceId}</td>
                        <td>${statusText}</td>
                        <td>${btnAction}</td>
                    </tr>
                `;
            });
        });
    }

    // Fungsi Ubah Status (Kill Switch Real-Time)
    function ubahStatus(deviceId, statusBaru) {
        db.collection("simple_devices").doc(deviceId).update({
            status: statusBaru
        }).then(() => {
            console.log(`Status device ${deviceId} diubah menjadi ${statusBaru}`);
        }).catch((error) => {
            alert("Gagal mengubah status: " + error.message);
        });
    }
</script>
</body>
</html>
