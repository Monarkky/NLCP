<!DOCTYPE html>
<html lang="en" style="height: 100%; margin: 0; background-color: #030712; color: #f3f4f6;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nether LC panel (NLCP) - Agent Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; height: 100vh; font-family: 'Inter', sans-serif; background-color: #030712; color: #f3f4f6; display: flex; flex-direction: column; overflow: hidden; }
        
        /* AUTHENTICATION SCREEN */
        #auth-screen { position: fixed; inset: 0; background-color: #030712; color: #f3f4f6; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .auth-box { width: 100%; max-width: 420px; text-align: center; background: #0f172a; border: 1px solid #1e293b; padding: 32px; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); }
        .auth-logo { width: 64px; height: 64px; margin: 0 auto 12px auto; display: flex; align-items: center; justify-content: center; background: rgba(37,99,235,0.15); border: 1px solid rgba(37,99,235,0.3); border-radius: 16px; color: #60a5fa; font-size: 28px; }
        .auth-btn { width: 100%; padding: 11px; margin-top: 14px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; background: #2563eb; color: white; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 13px; }
        .auth-btn:hover { background: #1d4ed8; }
        .auth-input { width: 100%; padding: 10px 12px; margin-bottom: 10px; background: #030712; border: 1px solid #1e293b; color: #fff; border-radius: 8px; font-size: 12px; outline: none; }
        .auth-input:focus { border-color: #2563eb; }

        /* HEADER & NAVIGATION */
        .app-header { height: 60px; background-color: #0f172a; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; }
        .app-main { flex: 1; display: flex; flex-direction: row; overflow: hidden; height: calc(100vh - 100px); width: 100vw; }
        
        /* GROUP TABS */
        .group-tabs-bar { height: 40px; background-color: #0b1120; border-bottom: 1px solid #1e293b; display: flex; align-items: center; padding: 0 16px; gap: 8px; overflow-x: auto; flex-shrink: 0; }
        .group-tab { padding: 6px 14px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; background: #1e293b; color: #94a3b8; border: 1px solid #334155; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
        .group-tab.active { background: #2563eb; color: #fff; border-color: #3b82f6; }

        /* SIDEBARS & WORKSPACE */
        .sidebar-left { width: 300px; background-color: #0f172a; border-right: 1px solid #1e293b; display: flex; flex-direction: column; flex-shrink: 0; position: relative; height: 100%; }
        .sidebar-bottom-profile { padding: 14px 16px; border-top: 1px solid #1e293b; background-color: #0b1121; display: flex; align-items: center; justify-content: space-between; cursor: pointer; position: relative; }
        .sidebar-bottom-profile:hover { background-color: #131c31; }
        #profile-popup { display: none; position: absolute; bottom: calc(100% + 8px); left: 12px; width: calc(100% - 24px); background: #0f172a; border: 1px solid #1e293b; border-radius: 10px; padding: 6px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.8); z-index: 50; }
        .popup-item { width: 100%; text-align: left; padding: 8px 10px; background: transparent; border: none; color: #cbd5e1; font-size: 12px; cursor: pointer; border-radius: 6px; display: flex; align-items: center; gap: 10px; }
        .popup-item:hover { background: #1e293b; color: #fff; }
        .popup-item.danger { color: #f87171; }

        #status-dropdown { display: none; position: absolute; top: calc(100% + 8px); right: 0; width: 140px; background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 4px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.8); z-index: 100; }
        .status-option { width: 100%; text-align: left; padding: 8px 10px; background: transparent; border: none; color: #cbd5e1; font-size: 12px; cursor: pointer; border-radius: 6px; display: flex; align-items: center; gap: 8px; }
        .status-option:hover { background: #1e293b; color: #fff; }

        .workspace-center { flex: 1; background-color: #030712; display: flex; flex-direction: column; overflow: hidden; height: 100%; }
        .sidebar-right { width: 320px; background-color: #0f172a; border-left: 1px solid #1e293b; display: flex; flex-direction: column; padding: 16px; overflow-y: auto; flex-shrink: 0; height: 100%; }
        
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #030712; } ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        .btn-blue { background-color: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12px; }
        .btn-blue:hover { background-color: #1d4ed8; }
        .btn-danger { background-color: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        .btn-danger:hover { background-color: rgba(239, 68, 68, 0.4); }
        .input-box { background-color: #030712; border: 1px solid #1e293b; color: white; padding: 10px 14px; border-radius: 8px; font-size: 12px; outline: none; width: 100%; }
        .input-box:focus { border-color: #2563eb; }
        
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; }
        .modal-box { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 24px; width: 580px; max-width: 92vw; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #1e293b; padding-bottom: 12px; }
        .modal-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; text-align: left; font-size: 12px; }
        .form-group label { color: #94a3b8; font-weight: 600; }
        .form-control { background: #030712; border: 1px solid #1e293b; color: #fff; padding: 10px; border-radius: 8px; font-size: 12px; outline: none; }
        .form-control:focus { border-color: #2563eb; }
        .form-control:disabled { opacity: 0.5; cursor: not-allowed; }
        
        #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast-item { background: #0f172a; border: 1px solid #1e293b; color: #fff; padding: 12px 18px; border-radius: 8px; font-size: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px; animation: slideIn 0.3s ease; }
        .toast-item.success { border-left: 4px solid #34d399; }
        .toast-item.error { border-left: 4px solid #f87171; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <!-- AGENT AUTHENTICATION SCREEN (LOGIN ONLY) -->
    <div id="auth-screen">
        <div class="auth-box">
            <div class="auth-logo"><i class="fa-solid fa-headset"></i></div>
            <h2 style="font-size: 20px; font-weight: bold; margin-bottom: 4px; color: #f8fafc;">Nether LC panel</h2>
            <p style="color: #94a3b8; font-size: 12px; margin-bottom: 20px;">Agent Portal Log In</p>
            <div style="text-align: left;">
                <label style="font-size: 11px; font-weight: 600; color: #94a3b8; display: block; margin-bottom: 4px;">Email address</label>
                <input type="email" id="login-email" class="auth-input" placeholder="agent@netherlc.com" autocomplete="off">
                <label style="font-size: 11px; font-weight: 600; color: #94a3b8; display: block; margin-bottom: 4px;">Password</label>
                <input type="password" id="login-pass" class="auth-input" placeholder="Enter password" autocomplete="off">
            </div>
            <button class="auth-btn" onclick="processAgentLogin()">Log in to Console</button>
            <p style="font-size: 11px; color: #64748b; margin-top: 16px;">Agent sign-up is disabled. Ask Super Admin for access.</p>
        </div>
    </div>

    <!-- 2FA OTP MODAL -->
    <div id="pin-modal" class="modal-overlay">
        <div class="modal-box" style="width: 380px; text-align: center;">
            <div style="width: 48px; height: 48px; background: rgba(37,99,235,0.2); color: #60a5fa; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto; font-size: 20px;"><i class="fa-solid fa-lock"></i></div>
            <h3 style="font-size: 16px; font-weight: bold; color: #e2e8f0; margin-bottom: 8px;">Google 2FA Code</h3>
            <p style="font-size: 12px; color: #94a3b8; margin-bottom: 16px;">Enter the 6-digit OTP code from Google Authenticator.</p>
            <div class="form-group" style="margin-bottom: 16px;"><input type="text" id="verify-pin-input" class="form-control" maxlength="6" placeholder="123456" style="text-align: center; letter-spacing: 4px; font-size: 18px;"></div>
            <div style="display: flex; gap: 8px;">
                <button onclick="verify2FA()" class="btn-blue" style="flex: 1;">Verify Code</button>
                <button onclick="closeModals()" style="background: #1e293b; border: none; color: #cbd5e1; padding: 8px; border-radius: 8px; font-size: 12px; cursor: pointer; flex: 1;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- CUSTOM IN-APP CONFIRMATION MODAL -->
    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-box" style="width: 400px; text-align: center;">
            <div style="width: 48px; height: 48px; background: rgba(239,68,68,0.15); color: #f87171; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto; font-size: 20px;">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 id="confirm-modal-title" style="font-size: 16px; font-weight: bold; color: #e2e8f0; margin-bottom: 8px;">Are you sure?</h3>
            <p id="confirm-modal-msg" style="font-size: 12px; color: #94a3b8; margin-bottom: 20px;">This action cannot be undone.</p>
            <div style="display: flex; gap: 10px;">
                <button id="confirm-modal-btn-yes" class="btn-danger" style="flex: 1; padding: 10px;">Yes, Confirm</button>
                <button onclick="closeConfirmModal()" style="background: #1e293b; border: none; color: #cbd5e1; padding: 10px; border-radius: 8px; font-size: 12px; cursor: pointer; flex: 1;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="settings-title" style="font-size: 15px; font-weight: bold; color: #f8fafc; margin: 0;">Settings</h3>
                <button onclick="closeModals()" style="background: transparent; border: none; color: #94a3b8; font-size: 16px; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="settings-content"></div>
        </div>
    </div>

    <!-- HEADER NAVIGATION -->
    <header class="app-header">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div style="background-color: #2563eb; padding: 8px 12px; border-radius: 10px; color: white;"><i class="fa-solid fa-headset text-lg"></i></div>
            <h1 style="font-size: 15px; font-weight: bold; margin: 0; display: flex; align-items: center; gap: 8px;">Nether LC panel
                <span id="api-status-badge" style="font-size: 10px; background: rgba(52,211,153,0.15); color: #34d399; border: 1px solid rgba(52,211,153,0.3); padding: 2px 8px; border-radius: 12px;"><i class="fa-solid fa-plug-circle-check"></i> Connected</span>
            </h1>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
            <button onclick="switchView('dashboard')" id="nav-btn-dash" class="btn-blue" style="background: #2563eb; font-size: 11px;"><i class="fa-solid fa-comments"></i> Live Chat</button>
            <button onclick="switchView('archive')" id="nav-btn-archive" class="btn-blue" style="background: #1e293b; font-size: 11px;"><i class="fa-solid fa-box-archive"></i> Archive</button>
            <button onclick="switchView('team')" id="nav-btn-team" class="btn-blue" style="background: #1e293b; font-size: 11px;"><i class="fa-solid fa-users"></i> Team</button>
            
            <div style="position: relative;">
                <button onclick="toggleStatusDropdown(event)" id="header-status-btn" style="font-size: 12px; background: rgba(16,185,129,0.2); color: #34d399; border: 1px solid rgba(16,185,129,0.3); padding: 6px 14px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-weight: 600;">
                    <i class="fa-solid fa-circle text-[7px]" id="header-status-dot"></i> <span id="header-status-text">Online</span> <i class="fa-solid fa-chevron-down text-[10px]"></i>
                </button>
                <div id="status-dropdown">
                    <button class="status-option" onclick="setAgentStatus('online')"><i class="fa-solid fa-circle text-emerald-400 text-[8px]"></i> Online</button>
                    <button class="status-option" onclick="setAgentStatus('offline')"><i class="fa-solid fa-circle text-slate-500 text-[8px]"></i> Offline</button>
                </div>
            </div>
        </div>
    </header>

    <div class="group-tabs-bar" id="group-tabs-bar"></div>
    <main class="app-main" id="main-view-container"></main>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('nlcp_agent_user')) || null;
        let teamMembers = JSON.parse(localStorage.getItem('nlcp_team_members')) || [];
        let onConfirmCallback = null;
        
        let groups = JSON.parse(localStorage.getItem('nlcp_groups')) || [
            { id: "exp", name: "EXP", serverUrl: "http://localhost:3000", apiKey: "exp_key_1001", activeChats: {}, cannedMessages: [ { id: 1, title: "EXP Welcome", text: "Welcome to EXP LiveChat Support!" } ] },
            { id: "exs", name: "EXS", serverUrl: "http://localhost:3001", apiKey: "exs_key_1002", activeChats: {}, cannedMessages: [ { id: 1, title: "EXS Info", text: "Welcome to EXS Support Center." } ] }
        ];

        let activeGroupId = localStorage.getItem('nlcp_active_group') || "exp";
        let chatHistory = JSON.parse(localStorage.getItem('nlcp_chat_history')) || [];
        
        let socket = null;
        let selectedChatId = null;
        let currentAppView = 'dashboard';

        function saveTeam() { localStorage.setItem('nlcp_team_members', JSON.stringify(teamMembers)); }
        function saveGroups() { localStorage.setItem('nlcp_groups', JSON.stringify(groups)); }

        function getActiveGroup() {
            return groups.find(g => g.id === activeGroupId) || groups[0] || { id: "default", name: "Default", serverUrl: "http://localhost:3000", apiKey: "key", activeChats: {}, cannedMessages: [] };
        }

        // CONFIRM MODAL LOGIC
        function showInAppConfirm(title, message, onConfirm) {
            document.getElementById('confirm-modal-title').innerText = title;
            document.getElementById('confirm-modal-msg').innerText = message;
            onConfirmCallback = onConfirm;
            document.getElementById('confirm-modal-btn-yes').onclick = function() {
                if (onConfirmCallback) onConfirmCallback();
                closeConfirmModal();
            };
            document.getElementById('confirm-modal').style.display = 'flex';
        }

        function closeConfirmModal() {
            document.getElementById('confirm-modal').style.display = 'none';
            onConfirmCallback = null;
        }

        function processAgentLogin() {
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            
            teamMembers = JSON.parse(localStorage.getItem('nlcp_team_members')) || [];
            const user = teamMembers.find(m => m.email === email && m.password === pass);
            
            if (!user) { showToast("Invalid agent credentials", "error"); return; }

            currentUser = user;
            localStorage.setItem('nlcp_agent_user', JSON.stringify(currentUser));

            if (user.twoFactorEnabled) {
                document.getElementById('pin-modal').style.display = 'flex';
            } else {
                completeAuthSuccess();
            }
        }

        function verify2FA() {
            const pin = document.getElementById('verify-pin-input').value.trim();
            if (pin.length === 6) {
                closeModals();
                completeAuthSuccess();
            } else {
                showToast("Invalid 6-digit OTP code", "error");
            }
        }

        function completeAuthSuccess() {
            document.getElementById('auth-screen').style.display = 'none';
            updateAvatarUI();
            updateHeaderStatusUI();
            renderGroupTabs();
            initLiveChatAPIConnection();
            switchView('dashboard');
            showToast(`Welcome ${currentUser.name}!`);
        }

        function executeLogout() {
            currentUser = null;
            localStorage.removeItem('nlcp_agent_user');
            document.getElementById('auth-screen').style.display = 'flex';
            showToast("Logged out");
        }

        function renderGroupTabs() {
            const bar = document.getElementById('group-tabs-bar');
            if (!bar) return;
            bar.innerHTML = groups.map(g => `
                <div class="group-tab ${g.id === activeGroupId ? 'active' : ''}" onclick="switchGroup('${g.id}')">
                    <i class="fa-solid fa-layer-group"></i> ${g.name}
                </div>
            `).join('');
        }

        function switchGroup(groupId) {
            activeGroupId = groupId;
            localStorage.setItem('nlcp_active_group', activeGroupId);
            selectedChatId = null;
            renderGroupTabs();
            initLiveChatAPIConnection();
            if (currentAppView === 'dashboard') renderAgentDashboard();
            showToast(`Switched to Group: ${getActiveGroup().name}`);
        }

        function initLiveChatAPIConnection() {
            const group = getActiveGroup();
            try {
                if (socket) socket.disconnect();
                socket = io(group.serverUrl, { autoConnect: true, query: { apiKey: group.apiKey, groupId: group.id } });

                socket.on('connect', () => {
                    socket.emit('register_agent', { agentEmail: currentUser ? currentUser.email : '', groupId: group.id });
                    updateApiBadge(true);
                });

                socket.on('connect_error', () => { updateApiBadge(false); });

                socket.on('sync_state', (state) => {
                    group.activeChats = state || {};
                    saveGroups();
                    if (!selectedChatId && Object.keys(group.activeChats).length > 0) {
                        selectedChatId = Object.keys(group.activeChats)[0];
                    }
                    if (selectedChatId && !group.activeChats[selectedChatId]) {
                        selectedChatId = null;
                    }
                    if (currentAppView === 'dashboard') renderAgentDashboard();
                });
            } catch (err) { updateApiBadge(false); }
        }

        function updateApiBadge(isConnected) {
            const badge = document.getElementById('api-status-badge');
            if (!badge) return;
            const group = getActiveGroup();
            if (isConnected) {
                badge.style.background = "rgba(52,211,153,0.15)";
                badge.style.color = "#34d399";
                badge.style.borderColor = "rgba(52,211,153,0.3)";
                badge.innerHTML = `<i class="fa-solid fa-plug-circle-check"></i> ${group.name} Connected`;
            } else {
                badge.style.background = "rgba(248,113,113,0.15)";
                badge.style.color = "#f87171";
                badge.style.borderColor = "rgba(248,113,113,0.3)";
                badge.innerHTML = `<i class="fa-solid fa-plug-circle-xmark"></i> ${group.name} Offline`;
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast-item ${type}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-triangle-exclamation text-red-400'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3500);
        }

        function updateHeaderStatusUI() {
            const btn = document.getElementById('header-status-btn');
            const text = document.getElementById('header-status-text');
            const dot = document.getElementById('header-status-dot');
            if(!btn || !text || !dot || !currentUser) return;

            const isOnline = currentUser.status === 'online';
            if (isOnline) {
                btn.style.background = "rgba(16,185,129,0.2)";
                btn.style.color = "#34d399";
                btn.style.borderColor = "rgba(16,185,129,0.3)";
                text.innerText = "Online";
                dot.className = "fa-solid fa-circle text-[7px] text-emerald-400";
            } else {
                btn.style.background = "#1e293b";
                btn.style.color = "#94a3b8";
                btn.style.borderColor = "#334155";
                text.innerText = "Offline";
                dot.className = "fa-solid fa-circle text-[7px] text-slate-500";
            }
        }

        function toggleStatusDropdown(event) {
            if(event) event.stopPropagation();
            const dropdown = document.getElementById('status-dropdown');
            if(dropdown) dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
        }

        function setAgentStatus(status) {
            if(!currentUser) return;
            currentUser.status = status;
            
            teamMembers = JSON.parse(localStorage.getItem('nlcp_team_members')) || [];
            const tm = teamMembers.find(m => m.email === currentUser.email);
            if(tm) tm.status = status;
            
            saveTeam();
            localStorage.setItem('nlcp_agent_user', JSON.stringify(currentUser));
            
            updateHeaderStatusUI();
            document.getElementById('status-dropdown').style.display = 'none';
            showToast(`Status set to ${status}`);
            if(currentAppView === 'team') renderTeamView(document.getElementById('main-view-container'));
        }

        function updateAvatarUI() {
            const container = document.getElementById('display-avatar-container');
            const agentNameEl = document.getElementById('display-agent-name');
            if(!currentUser) return;
            if(agentNameEl) agentNameEl.innerText = currentUser.name || "Agent";
            if(container) {
                if(currentUser.avatar) container.innerHTML = `<img src="${currentUser.avatar}" style="width:100%; height:100%; object-fit:cover;">`;
                else container.innerHTML = (currentUser.name || "A").charAt(0).toUpperCase();
            }
        }

        function toggleProfileMenu(event) {
            if(event) event.stopPropagation();
            const p = document.getElementById('profile-popup');
            if(p) p.style.display = p.style.display === 'block' ? 'none' : 'block';
        }

        window.onclick = function(event) {
            if (!event.target.closest('.sidebar-bottom-profile')) {
                const p = document.getElementById('profile-popup');
                if(p) p.style.display = 'none';
            }
            if (!event.target.closest('#header-status-btn')) {
                const dropdown = document.getElementById('status-dropdown');
                if(dropdown) dropdown.style.display = 'none';
            }
        }

        function switchView(viewName) {
            currentAppView = viewName;
            const container = document.getElementById('main-view-container');
            document.getElementById('nav-btn-dash').style.background = viewName === 'dashboard' ? '#2563eb' : '#1e293b';
            document.getElementById('nav-btn-archive').style.background = viewName === 'archive' ? '#2563eb' : '#1e293b';
            document.getElementById('nav-btn-team').style.background = viewName === 'team' ? '#2563eb' : '#1e293b';

            if (viewName === 'dashboard') {
                const group = getActiveGroup();
                container.innerHTML = `
                    <div class="sidebar-left">

        function renderArchiveView(container) {
            container.innerHTML = `
                <div style="padding: 24px; color: #cbd5e1; width: 100%; height: 100%; display: flex; flex-direction: column; gap: 16px; overflow-y: auto;">

                        <h2 style="font-size: 18px; font-weight: bold; margin: 0; color: #f8fafc;">Chat Archives</h2>
                        <span style="font-size: 12px; color: #94a3b8;">Total Sessions Archived: ${chatHistory.length}</span>
                    </div>

                    <div style="background: #0f172a; border: 1px solid #1e293b; padding: 14px; border-radius: 10px; display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap;">
                        <div style="flex: 1; min-width: 180px;" class="form-group">
                            <label>Search Customer / Message</label>
                            <input type="text" id="arch-search" class="form-control" placeholder="Search keyword..." oninput="filterArchives()">
                        </div>
                        <div style="width: 170px;" class="form-group">
                            <label><i class="fa-solid fa-calendar-days text-blue-400"></i> Calendar Picker</label>
                            <input type="date" id="arch-date" class="form-control" onchange="filterArchives()">
                        </div>
                        <div style="padding-bottom: 10px; display: flex; align-items: center; gap: 8px;">
                            <label style="font-size: 12px; color: #f87171; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                                <input type="checkbox" id="arch-unresponded" onchange="filterArchives()"> Unresponded Only
                            </label>
                        </div>
                        <button onclick="resetArchiveFilters()" class="btn-blue" style="background: #1e293b; height: 38px;">Reset</button>
                    </div>

                    <div id="archive-items-list" style="display: flex; flex-direction: column; gap: 10px; flex: 1;"></div>
                </div>
            `;
            filterArchives();
        }

        function filterArchives() {
            const searchText = (document.getElementById('arch-search')?.value || '').toLowerCase();
            const filterDate = document.getElementById('arch-date')?.value || '';
            const unrespondedOnly = document.getElementById('arch-unresponded')?.checked || false;

            let filtered = chatHistory.filter(h => {
                const matchesSearch = !searchText || h.customerName.toLowerCase().includes(searchText) || (h.lastMessage && h.lastMessage.toLowerCase().includes(searchText));
                const matchesDate = !filterDate || h.date === filterDate;
                const matchesUnresponded = !unrespondedOnly || h.responded === false;
                return matchesSearch && matchesDate && matchesUnresponded;
            });

            const listEl = document.getElementById('archive-items-list');
            if(!listEl) return;

            if (filtered.length === 0) {
                listEl.innerHTML = `<div style="text-align: center; padding: 40px; color: #64748b; font-size: 13px;">No archived chats match the specified filters.</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(h => `
                <div style="background: #0f172a; border: 1px solid #1e293b; padding: 14px; border-radius: 10px; font-size: 12px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                        <strong style="color: #60a5fa; font-size: 13px;">${h.customerName}</strong>
                        <span style="color: #94a3b8; font-size: 11px;">${h.date} • ${h.time}</span>
                    </div>
                    <p style="color: #cbd5e1; margin: 0 0 8px 0;">"${h.lastMessage || 'No messages'}"</p>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 10px; background: #030712; padding: 2px 8px; border-radius: 4px; border: 1px solid #1e293b; color: #94a3b8;">Group: ${h.groupName || 'EXP'}</span>
                        <span style="font-size: 10px; font-weight: bold; color: ${h.responded ? '#34d399' : '#f87171'};">
                            ${h.responded ? '✓ Responded' : '⚠️ Unresponded'}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        function resetArchiveFilters() {
            if(document.getElementById('arch-search')) document.getElementById('arch-search').value = '';
            if(document.getElementById('arch-date')) document.getElementById('arch-date').value = '';
            if(document.getElementById('arch-unresponded')) document.getElementById('arch-unresponded').checked = false;
            filterArchives();
        }

            container.innerHTML = `

                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 12px;">
                        <div>
                            <h2 style="font-size: 18px; font-weight: bold; margin: 0; color: #f8fafc;">NLCP Team Roster</h2>

                                        <i class="fa-solid fa-circle text-[8px] ${m.status === 'online' ? 'text-emerald-400' : 'text-slate-500'}"></i> ${m.status === 'online' ? 'Online' : 'Offline'}

        function renderAgentDashboard() {
            const queueList = document.getElementById('agent-chats-list');
            const queueCount = document.getElementById('queue-count');
            const workspace = document.getElementById('agent-active-workspace');
            const infoName = document.getElementById('info-name');
            const infoDevice = document.getElementById('info-device');
            const infoIp = document.getElementById('info-ip');

            if(!queueList || !workspace) return;

            const group = getActiveGroup();
            const chatKeys = Object.keys(group.activeChats);
            queueCount.innerText = chatKeys.length;

            if (chatKeys.length === 0) {
                queueList.innerHTML = `<div style="padding: 20px; text-align: center; color: #64748b; font-size: 11px;">Waiting for incoming chats on ${group.name}...</div>`;
                workspace.innerHTML = `<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #64748b;"><i class="fa-solid fa-headset text-3xl mb-2 text-slate-700"></i><h3 style="color: #cbd5e1; font-size: 14px; margin: 0;">Nether LC panel Standby (${group.name})</h3></div>`;
                infoName.innerText = 'No visitor selected';
                infoDevice.innerText = '-';
                infoIp.innerText = '-';
                return;
            }

            queueList.innerHTML = chatKeys.map(id => `
                <div onclick="selectChat('${id}')" style="padding: 12px 16px; background: ${id === selectedChatId ? '#1e293b' : '#030712'}; border-left: 4px solid ${id === selectedChatId ? '#2563eb' : 'transparent'}; cursor: pointer; border-bottom: 1px solid #1e293b;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-weight: bold; font-size: 12px; color: #e2e8f0;">${group.activeChats[id].customer ? group.activeChats[id].customer.name : 'Visitor'}</span>
                        <span style="font-size: 9px; background: rgba(37,99,235,0.2); color: #60a5fa; padding: 2px 6px; border-radius: 4px;">Live</span>
                    </div>
                </div>
            `).join('');

            const currentChat = group.activeChats[selectedChatId];
            if(!currentChat) {
                workspace.innerHTML = `<div style="flex: 1; display: flex; align-items: center; justify-content: center; color: #64748b;">Select a active conversation.</div>`;
                return;
            }

            infoName.innerText = currentChat.customer ? currentChat.customer.name : 'Website Visitor';
            infoDevice.innerText = currentChat.customer ? currentChat.customer.device : 'Browser';
            infoIp.innerText = currentChat.customer ? currentChat.customer.ip : '127.0.0.1';

            let messagesHtml = (currentChat.messages || []).map(m => {
                const isAgent = m.sender === 'agent';
                return `
                    <div style="display: flex; flex-direction: column; align-items: ${isAgent ? 'flex-end' : 'flex-start'}; margin-bottom: 14px;">
                        <span style="font-size: 10px; color: #64748b; margin-bottom:3px;">${m.senderName || (isAgent ? currentUser.name : 'Visitor')} • ${m.time || ''}</span>
                        <div style="max-width: 75%; padding: 10px 14px; border-radius: 14px; font-size: 12px; ${isAgent ? 'background: #2563eb; color: white;' : 'background: #0f172a; color: #e2e8f0; border: 1px solid #1e293b;'}">${m.text}</div>
                    </div>`;
            }).join('');

            workspace.innerHTML = `
                <div style="height: 60px; background: #0f172a; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; padding: 0 20px;">
                    <h4 style="font-size: 13px; font-weight: bold; color: #e2e8f0; margin: 0;">${currentChat.customer ? currentChat.customer.name : 'Visitor'} (${group.name})</h4>
                    <button onclick="closeChatSession()" style="background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #f87171; padding: 6px 12px; border-radius: 8px; font-size: 11px; cursor: pointer;">Close & Archive Session</button>
                </div>
                <div style="flex: 1; overflow-y: auto; padding: 20px;" id="agent-msg-scroll">${messagesHtml}</div>
                <div style="padding: 12px 20px; background: #0f172a; border-top: 1px solid #1e293b; display: flex; gap: 10px;">
                    <input type="text" id="agent-input-box" onkeydown="if(event.key==='Enter') sendAgentMessage()" placeholder="Type your reply or draft using Gemini AI..." class="input-box">
                    <button onclick="sendAgentMessage()" class="btn-blue"><i class="fa-solid fa-paper-plane"></i></button>
                </div>`;

            const scrollArea = document.getElementById('agent-msg-scroll');
            if (scrollArea) scrollArea.scrollTop = scrollArea.scrollHeight;
        }

        function selectChat(id) { selectedChatId = id; renderAgentDashboard(); }

        function sendAgentMessage() {
            const input = document.getElementById('agent-input-box');
            if (!input || !input.value.trim() || !selectedChatId) return;

            const textMsg = input.value.trim();
            const group = getActiveGroup();

            if (socket) {
                socket.emit('agent_message', {
                    customerId: selectedChatId,
                    text: textMsg,
                    agentName: currentUser ? currentUser.name : "Agent",
                    groupId: group.id
                });
            }

            if (group.activeChats[selectedChatId]) {
                group.activeChats[selectedChatId].messages.push({
                    sender: 'agent',
                    senderName: currentUser ? currentUser.name : "Agent",
                    text: textMsg,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });
                group.activeChats[selectedChatId].hasAgentReplied = true;
                saveGroups();
            }

            input.value = '';
            renderAgentDashboard();
        }

        function closeChatSession() {
            if(!selectedChatId) return;
            
            showInAppConfirm(
                "Close Chat Session", 
                "Are you sure you want to end this conversation?", 
                function() {
                    const group = getActiveGroup();
                    const currentChat = group.activeChats[selectedChatId];
                    
                    const hasReplied = currentChat && (currentChat.hasAgentReplied || (currentChat.messages && currentChat.messages.some(m => m.sender === 'agent')));

                    chatHistory.push({
                        id: Date.now(),
                        groupName: group.name,
                        customerName: currentChat && currentChat.customer ? currentChat.customer.name : 'Visitor',
                        date: new Date().toISOString().split('T')[0],
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        lastMessage: currentChat && currentChat.messages && currentChat.messages.length > 0 ? currentChat.messages[currentChat.messages.length - 1].text : "No messages",
                        responded: Boolean(hasReplied)
                    });
                    localStorage.setItem('nlcp_chat_history', JSON.stringify(chatHistory));

                    if(socket) socket.emit('close_chat', selectedChatId);
                    delete group.activeChats[selectedChatId];
                    saveGroups();

                    selectedChatId = null;
                    showToast("Session closed and archived");
                    renderAgentDashboard();
                }
            );
        }

        function renderCannedResponses() {
            const container = document.getElementById('canned-list-container');
            if(!container) return;
            const group = getActiveGroup();
            
            if(!group.cannedMessages || group.cannedMessages.length === 0) {
                container.innerHTML = `<div style="font-size: 11px; color: #64748b;">No canned responses added for ${group.name}.</div>`;
                return;
            }

            container.innerHTML = group.cannedMessages.map(c => `
                <button onclick="insertCannedResponse('${c.text.replace(/'/g, "\\'")}')" style="background: #030712; border: 1px solid #1e293b; color: #cbd5e1; padding: 8px; border-radius: 6px; font-size: 11px; text-align: left; cursor: pointer;">💬 ${c.title}</button>
            `).join('');
        }

        function insertCannedResponse(text) {
            const input = document.getElementById('agent-input-box');
            if (input) { input.value = text; input.focus(); }
        }

            const modal = document.getElementById('settings-modal');
            const title = document.getElementById('settings-title');
            const content = document.getElementById('settings-content');
            const group = getActiveGroup();
            modal.style.display = 'flex';

            if (tab === '2fa') {
                title.innerText = "Google Authenticator / 2FA QR Code";
                const secret = currentUser ? (currentUser.twoFactorSecret || 'NLCPSECRET88') : 'NLCPSECRET88';
                const qrData = `otpauth://totp/NLCP:${encodeURIComponent(currentUser ? currentUser.email : 'agent')}?secret=${secret}&issuer=NetherLCPanel`;
                const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(qrData)}`;

                content.innerHTML = `
                    <div style="background: #030712; padding: 16px; border-radius: 10px; border: 1px solid #1e293b; text-align: center;">
                        <h4 style="margin: 0 0 8px 0; font-size: 14px; color: #f8fafc;">Scan QR Code with Google Authenticator</h4>
                        <div style="background: #fff; padding: 10px; border-radius: 8px; width: 200px; margin: 0 auto 12px auto;">
                            <img src="${qrApiUrl}" alt="Google Authenticator QR Code" style="width: 100%; height: 100%; display: block;">
                        </div>
                        <p style="font-size: 11px; color: #94a3b8; margin-bottom: 12px;">Manual Secret Key: <strong style="color: #34d399;">${secret}</strong></p>
                        <div class="form-group" style="text-align: left; margin-top: 12px;">
                            <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                                <input type="checkbox" id="check-enable-2fa" ${currentUser && currentUser.twoFactorEnabled ? 'checked' : ''}> Enable 2FA Protection
                            </label>
                        </div>
                        <button onclick="save2FASettings()" class="btn-blue" style="margin-top: 12px; width: 100%;">Save 2FA Status</button>
                    </div>
                `;
            } else if (tab === 'profile') {
                title.innerText = "Edit Profile";
                content.innerHTML = `
                    <div class="form-group"><label>Full Name</label><input type="text" id="set-prof-name" class="form-control" value="${currentUser ? currentUser.name : ''}"></div>
                    <div class="form-group"><label>Email Address (Locked)</label><input type="email" class="form-control" value="${currentUser ? currentUser.email : ''}" disabled></div>
                    <div class="form-group"><label>Password</label><input type="password" id="set-prof-pass" class="form-control" value="${currentUser ? currentUser.password : ''}"></div>
                    <div class="form-group">
                        <label>Profile Image</label>
                        <input type="file" id="set-prof-avatar-file" accept="image/*" class="form-control" onchange="handleAvatarFileSelect(event)">
                    </div>
                    <button onclick="saveProfileSettings()" class="btn-blue" style="margin-top: 10px;">Save Changes</button>
                `;
            } else if (tab === 'canned') {
                title.innerText = `Canned Replies (${group.name})`;
                let cannedItemsHtml = (group.cannedMessages || []).map(c => `
                    <div style="display: flex; justify-content: space-between; align-items: center; background: #030712; padding: 8px 12px; border-radius: 6px; border: 1px solid #1e293b;">
                        <div><strong style="font-size: 12px; color: #60a5fa;">${c.title}</strong><p style="font-size: 11px; color: #94a3b8; margin: 2px 0 0 0;">${c.text}</p></div>
                        <button onclick="deleteCannedResponse(${c.id})" class="btn-danger"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `).join('');

                content.innerHTML = `
                    <div style="display: flex; flex-direction: column; gap: 8px; max-height: 180px; overflow-y: auto;">${cannedItemsHtml || '<p style="font-size:11px; color:#64748b;">No canned replies added.</p>'}</div>
                    <div style="border-top: 1px solid #1e293b; padding-top: 12px; margin-top: 8px;">
                        <h4 style="font-size: 12px; margin: 0 0 8px 0;">Add Response for ${group.name}</h4>
                        <div class="form-group"><label>Shortcut Title</label><input type="text" id="can-title" class="form-control" placeholder="e.g. Welcome"></div>
                        <div class="form-group" style="margin-top: 6px;"><label>Message Content</label><textarea id="can-text" class="form-control" rows="2" placeholder="Message content..."></textarea></div>
                        <button onclick="addCannedResponse()" class="btn-blue" style="margin-top: 10px;">Add Reply</button>
                    </div>
                `;

        }

        function save2FASettings() {
            if(!currentUser) return;
            currentUser.twoFactorEnabled = document.getElementById('check-enable-2fa').checked;
            
            teamMembers = JSON.parse(localStorage.getItem('nlcp_team_members')) || [];
            const tm = teamMembers.find(m => m.email === currentUser.email);
            if(tm) tm.twoFactorEnabled = currentUser.twoFactorEnabled;

            saveTeam();
            localStorage.setItem('nlcp_agent_user', JSON.stringify(currentUser));
            closeModals();
            showToast("2FA Settings updated");
        }

        function handleAvatarFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) { if(currentUser) currentUser.avatar = e.target.result; };
                reader.readAsDataURL(file);
            }
        }

        function saveProfileSettings() {
            if(!currentUser) return;
            currentUser.name = document.getElementById('set-prof-name').value.trim() || "Agent";
            currentUser.password = document.getElementById('set-prof-pass').value.trim();

            teamMembers = JSON.parse(localStorage.getItem('nlcp_team_members')) || [];
            const tm = teamMembers.find(m => m.email === currentUser.email);
            if(tm) { tm.name = currentUser.name; tm.password = currentUser.password; }

            saveTeam();
            localStorage.setItem('nlcp_agent_user', JSON.stringify(currentUser));
            updateAvatarUI();
            closeModals();
            showToast("Profile updated");
        }

        function addCannedResponse() {
            const title = document.getElementById('can-title').value.trim();
            const text = document.getElementById('can-text').value.trim();
            if (!title || !text) return;

            const group = getActiveGroup();
            if(!group.cannedMessages) group.cannedMessages = [];
            group.cannedMessages.push({ id: Date.now(), title, text });
            saveGroups();

            renderCannedResponses();
            openSettings('canned');
            showToast("Canned reply added");
        }

        function deleteCannedResponse(id) {
            const group = getActiveGroup();
            group.cannedMessages = group.cannedMessages.filter(c => c.id !== id);
            saveGroups();
            renderCannedResponses();
            openSettings('canned');
            showToast("Canned reply deleted");
        }

        function closeModals() {
            document.getElementById('settings-modal').style.display = 'none';
            document.getElementById('pin-modal').style.display = 'none';
        }

        async function aiCallGemini() {
            const outBox = document.getElementById('ai-output-box');
            if(!outBox) return;
            outBox.style.display = 'block'; 
            outBox.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Gemini AI drafting response...';

            setTimeout(() => {
                const input = document.getElementById('agent-input-box');
                const group = getActiveGroup();
                const draftText = `Hello! Thank you for reaching out to ${group.name} support. How can I assist you with your inquiry today?`;
                if(input) {
                    input.value = draftText;
                    input.focus();
                }
                outBox.innerHTML = `<strong>Draft generated into input box! Review before sending.</strong>`;
            }, 800);
        }

        window.onload = () => {
            if (!currentUser) {
                document.getElementById('auth-screen').style.display = 'flex';
            } else {
                document.getElementById('auth-screen').style.display = 'none';
                updateAvatarUI();
                updateHeaderStatusUI();
                renderGroupTabs();
                initLiveChatAPIConnection();
                switchView('dashboard');
            }
        };
    </script>
</body>
</html>
